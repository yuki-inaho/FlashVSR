[build-system]
requires = ["setuptools>=64,<81", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "diffsynth"
version = "1.1.7"
description = "FlashVSR inference (DiffSynth based)"
requires-python = ">=3.11,<3.12"
dependencies = [
    "torch==2.6.0",
    "torchaudio==2.6.0",
    "torchvision==0.21.0",
    "torchmetrics==1.7.3",
    "torchsde==0.2.6",
    "accelerate==1.8.1",
    "einops==0.8.1",
    "huggingface-hub[cli]==0.34.4",
    "matplotlib==3.10.3",
    "numpy==1.26.4",
    "opencv-python==4.11.0.86",
    "opencv-python-headless==4.11.0.86",
    "peft==0.16.0",
    "pillow==11.0.0",
    "safetensors==0.5.3",
    "sentencepiece==0.2.0",
    "transformers==4.46.2",
    "pytorch-lightning==2.5.2",
    "imageio==2.37.0",
    "imageio-ffmpeg==0.6.0",
    "protobuf==3.20.3",
    "ftfy==6.3.1",
    "pandas==2.3.0",
    "tqdm",
    "datasets",
    "modelscope>=1.40.1",
]

[tool.setuptools.packages.find]
include = ["diffsynth*"]

[tool.setuptools.package-data]
diffsynth = ["tokenizer_configs/**/**/*.*"]

[tool.uv]
default-groups = ["build"]

[dependency-groups]
build = [
    "ninja",
    "packaging",
    "psutil",
    "wheel",
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchaudio = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }
